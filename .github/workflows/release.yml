name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default. Only the job that actually publishes gets write,
# and it gets it on the job rather than here, so a compromised dependency in a
# build job cannot reach the release API with the workflow token.
permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Every third-party and first-party action below is pinned to a full
      # commit SHA, not a tag. A tag is a mutable pointer: whoever controls the
      # action's repository can move it, and this workflow runs on a tag push
      # with permission to publish the binaries users auto-update from. The
      # trailing comment records the human-readable version the SHA belongs to,
      # and .github/dependabot.yml keeps these pins moving.
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build jobs never push. Leaving the token in .git/config makes it
          # readable by anything the build runs, including postinstall scripts.
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc rather than hard-coding, so CI cannot drift away
          # from the version this project is developed and tested against.
          #
          # It had drifted: this said `node-version: 18`, while package.json
          # declares `engines.node >= 22.12.0` and .npmrc sets
          # `engine-strict=true`. That combination makes `npm install` fail
          # outright, so the release workflow could not have produced a build.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` rather than `npm install`: ci installs exactly what
        # package-lock.json pins and fails if the lockfile and package.json
        # disagree. With `npm install` the lockfile is advisory, so a release
        # build could silently pick up a different transitive dependency than
        # anything that was ever tested.
        run: npm ci

      - name: Build Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: npm run build-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows packages
        if: matrix.os == 'windows-latest'
        run: npm run build-all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS packages
        if: matrix.os == 'macos-latest'
        run: npm run build-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-builds
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/latest-mac.yml

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # The only job that needs to write, and the only one that gets to.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Create Release
        # Was `softprops/action-gh-release@v1`: a mutable tag on a third-party
        # action, in the one job holding `contents: write`. Now pinned to a SHA,
        # and moved off v1, which is unmaintained and runs on a Node runtime
        # GitHub has retired.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            linux-builds/*
            windows-builds/*
            mac-builds/*
          draft: false
          prerelease: false
          # Fail loudly rather than publishing an empty or half-built release if
          # a matrix leg silently produced no artifacts.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
